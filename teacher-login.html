<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login - NAMCE</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      border: 1px solid #e2e8f0;
    }

    .login-box h2 {
      color: #1e3a8a;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .login-box p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .submit-btn {
      width: 100%;
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Teacher Portal Access</h2>
    <p>Sign in to publish academic notices, blogs, and review publications.</p>

    <form action="student-dashboard.html">
      <div class="form-group">
        <label>Faculty Email / ID</label>
        <input type="email" placeholder="faculty@namce.org" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="submit-btn">Faculty Sign In</button>
    </form>

    <a href="index.html" class="back-link">&larr; Return to Home Page</a>
  </div>

</body>
</html>
